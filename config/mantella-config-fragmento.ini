; -------------------------------------------------------------------------
; NO copies este fichero encima de tu config.ini.
;
; Son solo las claves que hay que CAMBIAR en el config.ini que genera
; Mantella la primera vez que arranca. Abre el tuyo, busca cada clave en la
; seccion donde ya este y sustituye su valor.
;
; Los nombres de seccion han cambiado entre versiones de Mantella; guiate
; por el nombre de la clave, no por el de la seccion.
; -------------------------------------------------------------------------

[LanguageModel]

; La clave importante: apunta Mantella al gateway en lugar de al proveedor.
; El puerto debe coincidir con MANTELLA_PORT del fichero .env (8000 por
; defecto). Ojo con el /v1 del final.
llm_api = http://localhost:8000/v1

; El modelo. Puedes dejar el que quieras aqui: el gateway lo respeta.
; Si lo pones a "mantella" o lo dejas vacio, se usa el MANTELLA_MODEL del .env,
; con lo que cambiar de modelo no requiere tocar este fichero.
model = mantella

; Numero maximo de frases por respuesta. Tambien se puede controlar desde el
; gateway con MANTELLA_MAX_SENTENCES; si usas las dos, gana la mas restrictiva.
max_response_sentences = 2

; Mantella exige que exista un fichero de clave aunque el gateway no la use.
; Si tu version lo pide, deja GPT_SECRET_KEY.txt con cualquier texto no vacio
; (por ejemplo "sk-local") y guarda la clave real en el .env del gateway.


[Speech]

; Motor de voz. xVASynth es el mas ligero; xtts suena mejor pero pide GPU.
tts_service = xvasynth


[Paths]

; Rutas de tu instalacion. Ajustalas a las tuyas.
skyrim_folder = C:\Program Files (x86)\Steam\steamapps\common\Skyrim Special Edition
skyrim_mod_folder = C:\Program Files (x86)\Steam\steamapps\common\Skyrim Special Edition\Data
xvasynth_folder = C:\Program Files (x86)\Steam\steamapps\common\xVASynth
